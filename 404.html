<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icon.png">
    <title>Jerry's Bio Card</title>
</head>
<style>
    @keyframes fade-in{
        from{
            opacity: 0;
        }
        to{
            opacity: 1;
        }
    }
    @keyframes milky-way{
        to{
            scale: 1;
        }
    }
    @keyframes arch{
        to{
            scale: 1;
        }
    }
    @font-face{
        font-family: minecraft-regular;
        src: url("fonts/MinecraftRegular.otf");
        font-weight: 400;
    }
    @font-face{
        font-family: minecraft-regular;
        src: url("fonts/MinecraftBold.otf");
        font-weight: 500;
    }
    body{
        margin: 0;
        overflow: hidden;
    }
    .container{
        width: 100vw;
        height: 100vh;
        background-color: rgb(255, 255, 255);
        display: flex;
        overflow: clip;
        justify-content: center;
        align-items: center;
        position: relative;
    }
    .card{
        min-width: 300px;
        z-index: 300;
        width: 50vw;
        max-width: 400px;
        min-height: 360px;
        height: 60vw;
        max-height: 500px;
        background-color: rgba(255, 255, 255, 0.75);
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        animation: fade-in 1.5s forwards;
    }
    .card h1{
        font-family: minecraft-regular;
        font-size: clamp(18px, 2vw, 23px);
        margin: 0;
    }
    .card p{
        font-family: minecraft-regular;
        margin: 0;
        opacity: 0.75;
        font-size: clamp(18px, 1.25vw, 22px);
    }
    .button{
        width: 60%;
        background: none;
        margin-top: 5%;
        padding: 2.5%;
        border-radius: 10px;
        font-family: minecraft-regular;
        font-size: clamp(12px, 1vw, 15px);
        border: 2px solid black;
        transition: background-color 0.5s ease;
    }
    .button:hover{
        cursor: url('/cursor-icon.png'), auto !important;
        cursor: pointer;
        background-color: rgb(0,0,0);
        color: white;
    }
    .milky-way{
        scale: 1.5;
        min-width: 1920px;
        min-height: 1080px;
        width: 100vw;
        height: 56.25vw;
        z-index: 100;
        position: absolute;
        animation: milky-way 5s forwards;
        display: block;
        transform-origin: center center;
        clip-path: inset(0 0 0 0);
    }
    .arch{
        scale: 5;
        min-width: 1920px;
        min-height: 1080px;
        width: 100vw;
        height: 56.25vw;
        z-index: 200;
        position: absolute;
        display: block;
        transform-origin: center center;
        animation: arch 4.5s forwards 0.5s;
        clip-path: inset(0 0 0 0);
    }
    

</style>
<body>
    <div class = "container">
        <img class = "milky-way" src = "backgrounds/milky-way-2.jpg">
        <img class = "arch" src = "backgrounds/arch.png">
        <div class = "card">
            <h1>Jerry's Profile Card</h1>
            <p>@small_j1337</p>
            <button class = "button" onclick = "location.assign('index.html')">My Portfolio</button>
            <button class = "button" onclick = "location.assign('https://www.instagram.com/small_j1337/')">Instagram</button>
            <button class = "button" onclick = "location.assign('https://www.youtube.com/@small_j1337')">YouTube Channel</button>
            <button class = "button" onclick = "location.assign('https://garage803racing.org/')">Garage 803 Racing</button>
            <button class = "button" onclick = "location.assign('https://sites.google.com/view/mvhsbc2m/welcome')">MVHS Bring Change to Mind</button>
        </div>
    </div>
</body>
</html>
