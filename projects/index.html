<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.png">
    <link rel = "stylesheet" href = "header.css">
    <link rel = "stylesheet" href = "text-styles.css">
    <link rel = "stylesheet" href = "footer.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
</head>
<style>
    body{
        margin: 0;
        overscroll-behavior: none;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
    }
    .container{
        width: 100vw;
        height: 40vw;
        background-image: url("projectBanner.jpg");
        background-position: center center;
        background-attachment: fixed;
        background-size: cover;
    }
    .title{
        position: absolute;
        z-index: 150;
        color: white;
        top: 15vw;
        font-size: 10vw !important;
        animation: site-title 5s forwards;
        text-decoration: underline;
        text-underline-offset: 1.5vw;
        text-decoration-color: rgb(255, 76, 106);
        font-family: urban-shadow;
        letter-spacing: 0.1vw;
    }
    .main-content-wrapper{
        width: 100vw;
        z-index: 999;
        background-color: rgb(255, 255, 255);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
    }
    .main-content{
        display: flex;
        flex-direction: column;
        align-items: center;
        align-self: center;
        flex: 1;
    }
    .projects-description{
        font-family: din-alternate; 
        margin-top: 2vw; 
        margin-left: 10vw; 
        margin-right: 10vw; 
        margin-bottom: 2vw; 
        text-align: center;
        padding: 2vw;
        border: 0.5vw solid black;
    }
    .gallery{
        column-count: 3;
        width: 95%;
        align-self: center;
        column-gap: 1vw;
        margin: 0 auto;
    }
    .gallery img{
        width: 100%;
        margin-top: 2vw;
        border-radius: 1vw;
        min-width: 100px;
    }
    @media(max-width: 770px){
        .gallery{
            column-count: 2;
            width: 95%;
            align-self: center;
            column-gap: 1vw;
            margin: 0 auto;
        }
    }
</style>
<body>
    <div class = "mobile-overlay" id = "mobile-overlay">
        <ul class = "mobile-links">
            <button class = "close" id = "close" onclick = "document.body.classList.remove('noScroll'); document.getElementById('mobile-overlay').classList.remove('show') ">&times</button>
            <li><a href = "/">Home</a></li>
            <li><a href = "/projects/">My Projects</a></li>
            <li><a href = "/community/">Community</a></li>
            
        </ul>
    </div>
    <div class = "container">
        <nav class = "navbar">
            <img class = "logo" src = "icon.png">
            <div class = "links">
                <li><a href = "/">Home</a></li>
                <li><a href = "/projects/">My Projects</a></li>
                <li><a href = "/community/">Community</a></li>
            </div>
            <button class = "hamburger" id = "hamburger" onclick = "document.body.classList.add('noScroll'); document.getElementById('mobile-overlay').classList.add('show') ">☰</button>
        </nav>
        <h1 class = "title">My Projects</h1>
    </div>
    <div class = "main-content-wrapper">
        <div class = "main-content">
            <p class = "projects-description">These are my art projects. Feel free to explore by clicking on them.</p>
            <div class = "gallery">
                <a href = "/artdescription.html#artwork1"><img src = "/artworks/Artwork1.svg"></a>
                <a href = "/artdescription.html#artwork2"><img src ="/artworks/Artwork2.svg"></a>
                <a href = "/artdescription.html#artwork3"><img src = "/artworks/Artwork3.jpg"></a>
                <a href = "/artdescription.html#artwork4"><img src = "/artworks/Artwork4.jpg"></a>
                <a href = "/artdescription.html#artwork5"><img src = "/artworks/Artwork5.jpg"></a>
                <a href = "/artdescription.html#artwork6"><img src = "/artworks/Artwork6.jpg"></a>
                <a href = "/artdescription.html#artwork7"><img src = "/artworks/Artwork7.jpg"></a>
                <a href = "/artdescription.html#artwork8"><img src = "/artworks/Artwork8.svg"></a>
                <a href = "/artdescription.html#artwork9"><img src = "/artworks/Artwork9.svg"></a>     
            </div>
        </div>
        <footer class = "footer">
            <div class = "icons">
                <img class = "youtube-logo" src = "yt logo.svg">
                <img class = "instagram-logo" src = "instagram logo.svg">
            </div>
            <p class = "copyright">© Jerry Liang 2025</p>
        </footer>
    </div>
</body>
</html>
