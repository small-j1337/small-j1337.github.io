<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.png">
    <link rel = "stylesheet" href = "header.css">
    <link rel = "stylesheet" href = "text-styles.css">
    <link rel = "stylesheet" href = "footer.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Landing Page</title>
</head>
<body>
    <style>
        @keyframes mid-ground{
            to{
                transform: translateY(0vw);
                opacity: 1;
                scale: 1;
            }
        }
        @keyframes fore-ground{
            to{
                scale: 1;
                opacity: 1;
            }
        }
        @keyframes back-ground{
            to{
                scale: 1;
            }
        }
        @keyframes site-title{
            from{opacity: 0;}to{opacity:0.8}
        }
        @keyframes fade-out{
            from{opacity: 1;}to{opacity:0;}
        }
        body{
            margin: 0;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
        }
        .container{
            /*Specify Height Here, not in CSS File*/
            height: 56.25vw;
            overflow: clip;
        }
        .foreground{
            scale: 4;
            opacity: 0;
            position: absolute;
            width: 100vw;
            z-index: 300;
            animation: fore-ground 2s forwards 3s;
            pointer-events: none;
            overscroll-behavior: none;
            overflow: clip;
        }
        .midground{
            transform: translateY(40vw);
            opacity: 0;
            scale: 3;
            position: fixed;
            width: 100vw;
            z-index: 200;
            animation: mid-ground 3s forwards 1s;
            transition: transform 3s ease;
            pointer-events: none;
            overscroll-behavior: none;
            overflow: clip;
        }
        .background{
            scale: 2;
            position: fixed;
            width: 100vw;
            z-index: 100;
            animation: back-ground 5s forwards;
            overscroll-behavior: none;
            overflow: clip;
        }
        .title{
            position: fixed;
            z-index: 150;
            color: white;
            top: clamp(50px,10vw,150px);
            font-size: 12.5vw !important;
            animation: site-title 5s forwards;
            text-decoration: underline;
            text-underline-offset: 1.5vw;
            text-decoration-color: rgb(255, 76, 106);
            font-family: urban-shadow;
        }
        .main-content-wrapper{
            width: 100vw;
            z-index: 999;
            background-color: rgb(208, 234, 255);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .main-content{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
    </style>
    <div class = "mobile-overlay" id = "mobile-overlay">
        <ul class = "mobile-links">
            <button class = "close" id = "close" onclick = "document.body.classList.remove('noScroll'); document.getElementById('mobile-overlay').classList.remove('show') ">&times</button>
            <li>Home</li>
            <li>My Projects</li>
            <li>Community</li>
        </ul>
    </div>
    <div class = "container">
        <nav class = "navbar">
            <img class = "logo" src = "icon.png">
            <div class = "links">
                <li>Home</li>
                <li>My Projects</li>
                <li>Community</li>
            </div>
            <button class = "hamburger" id = "hamburger" onclick = "document.body.classList.add('noScroll'); document.getElementById('mobile-overlay').classList.add('show') ">☰</button>
        </nav>
        <img class = "foreground" id = "foreground" src = "backgrounds/jerry-and-arch.png">
        <img class = "midground" id = "midground" src = "backgrounds/canyon-1.png">
        <img class = "background" id = "background" src = "backgrounds/milky-way-2.jpg">
        <h1 class = "title">JERRY LIANG</h1>
    </div>
    <div class = "main-content-wrapper">
        <div class = "main-content">
        </div>
        <footer class = "footer">
            <div class = "icons">
                <img class = "youtube-logo" src = "yt logo.svg">
                <img class = "instagram-logo" src = "instagram logo.svg">
            </div>
            <p class = "copyright">© Jerry Liang 2025</p>
        </footer>
    </div>
    <script>
        const midground = document.getElementById("midground");
        window.addEventListener("scroll",()=> {
            const scrollY = window.scrollY;
            midground.style.top = (-scrollY/3) + "px";
        }); 
    </script>
</body>
</html>
