<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.png">
    <link rel = "stylesheet" href = "/header.css">
    <link rel = "stylesheet" href = "/text-styles.css">
    <link rel = "stylesheet" href = "/footer.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerry's Portfolio - Community</title>
</head>
<style>
     @keyframes site-title{
        from{opacity: 0;}to{opacity:0.8}
    }
    body{
        margin: 0;
        overscroll-behavior: none;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
    }
    .container{
        width: 100vw;
        height: 33vw;
        background-image: linear-gradient(to right, rgba(0,0,0,0.75),rgba(0,0,0,0)),url("/backgrounds/communityBanner.jpg");
        background-position: center-top;
        background-attachment: fixed;
        background-size: 100vw 33vw;
    }
    .title{
        position: absolute;
        z-index: 150;
        color: white;
        top: 10vw;
        font-size: 10vw !important;
        animation: site-title 2.5s forwards;
        text-decoration: underline;
        text-underline-offset: 1.5vw;
        text-decoration-color: rgb(255, 76, 106);
        font-family: jerrys-handwriting;
    }
    .main-content-wrapper{
        width: 100vw;
        height: 150vh;
        z-index: 900;
        background-color: rgb(225, 240, 240);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .main-content{
        display: flex;
        flex-direction: column;
        align-items: center;
        align-self: center;
        flex: 1;
        width: 100vw;
    }
    .icons-container{
        display: flex;
        flex-wrap: wrap;
        justify-content: space-evenly;
    }
    .icon{
        width: 30vw;
        height: 30vw;
        margin-top: 2vw;
        overflow: clip;
        position: relative;
    }
    .icon img{
        width: 100%;
        transition: scale 0.25s ease;
        position: absolute;
    }
    .icon img:hover{
        scale: 1.1;
        cursor: pointer;
    }
    .icon-overlay{
       transform: translateY(100%);
        width: 100%;
        height: 100%;
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(0,0,0,0.75);
        pointer-events: none;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: din-alternate;
        transition: transform 0.75s ease;
        overflow: clip;
    }
    .icon:hover .icon-overlay{
        transform: translateY(0);
        width: 100%;
        height: 100%;
        position: absolute;
        background-color: rgba(0, 0, 0, 0.75);
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: din-alternate;
        z-index: 999;
    }
    .icon-overlay p{
        text-align: center;
        width: 75%;
    }
    @media(max-width: 770px){
        .icon{
            width: 40vw;
            height: 40vw;
        }
    }
</style>
<body>
    <div class = "mobile-overlay" id = "mobile-overlay">
        <ul class = "mobile-links" id = "mobile-links">
            <button class = "close" id = "close" onclick = "document.body.classList.remove('noScroll'); document.getElementById('mobile-overlay').classList.remove('show') ">&times</button>
            <li><a href = "/">Home</a></li>
            <li><a href = "/projects/">My Projects</a></li>
            <li><a href = "/community/">Community</a></li>
            
        </ul>
    </div>
    <div class = "container">
        <nav class = "navbar" class = "navbar">
            <img class = "logo" src = "/icon.png">
            <div class = "links">
                <li><a class = "menu-option" id = "menu-option" href = "/">Home</a></li>
                <li><a class = "menu-option" id = "menu-option" href = "/projects/">My Projects</a></li>
                <li><a class = "menu-option" id = "menu-option" href = "/community/">Community</a></li>
            </div>
            <button class = "hamburger" id = "hamburger" onclick = "document.body.classList.add('noScroll'); document.getElementById('mobile-overlay').classList.add('show') ">☰</button>
        </nav>
        <h1 class = "title">COMMUNITY</h1>
    </div>
    <div class = "main-content-wrapper">
        <div class = "main-content">
            <div class = "icons-container">
                <a class = "icon" href = "https://www.instagram.com/mvambassadors/" target = "_blank"><img src = "/logos/amb logo.png">
                    <div class = "icon-overlay"><p>MVHS Ambassadors</p></div>
                </a>
                <a class = "icon" href = "https://sites.google.com/view/mvhsbc2m/welcome" target = "_blank"><img src = "/logos/bc2m logo.jpeg">
                    <div class = "icon-overlay"><p>MVHS Bring Change to Mind Club</p></div>
                </a>
                <a class = "icon" href = "https://cengclass.org/" target = "_blank"><img src = "/logos/ceng logo.jpg">
                    <div class = "icon-overlay"><p>Computer Engineers of the Next Generation</p></div>
                </a>
                <a class = "icon" href = "https://cosmos382.wixsite.com/ucicosmos2024" target = "_blank"><img src = "/logos/cosmos logo.jpg">
                    <div class = "icon-overlay"><p>UCI COSMOS 2024</p></div>
                </a>
                <a class = "icon" href = "https://garage803racing.org/" target = "_blank"><img src = "/logos/g803 logo.png">
                    <div class = "icon-overlay"><p>Garage 803 Racing</p></div>
                </a>
                <a class = "icon" href = "https://www.mvslammagazine.com/" target = "_blank"><img src = "/logos/slam logo.jpeg">
                    <div class = "icon-overlay"><p>MVHS SLAM Magazine</p></div>
                </a>
            </div>
        </div>
        <footer class = "footer">
            <div class = "icons">
                <button onclick = "window.open('https://www.youtube.com/@small_j1337','_blank')"><img class = "youtube-logo" src = "/logos/yt logo.svg"></button>
                <button onclick = "window.open('https://www.instagram.com/small_j1337/','_blank')"><img class = "instagram-logo" src = "/logos/instagram logo.svg"></button>
            </div>
            <p class = "copyright">© Jerry Liang 2025</p>
        </footer>
    </div>
    <script src = "/navbar.js"></script>
</body>
</html>
