<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>small_j1337 Calc Resource Hub</title>
</head>
<style>
    @font-face{font-family: poxast; src: url("/fonts/Poxast.ttf");}
    @font-face{font-family: jost; src: url("/fonts/Jost-VariableFont_wght.ttf");}
    html{overscroll-behavior: none}
    body{
        width: 100vw;
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        background-color: rgb(221,242,245);
        overscroll-behavior: none;
    }
    .content-wrapper{
        width: 100vw;
        max-width: 1024px;
        margin: 5px;
        display: flex;
        flex-direction: column;
        flex: 1;
    }
    .header-content{
        height: clamp(75px,5vw,100px);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .main-content{
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
    }
    .section{
        margin: 10px;
        border: 2.5px solid rgb(24, 29, 34);
        border-radius: 10px;
        background-color: rgb(202,232,234);
        box-shadow: 5px 5px 0px 1px rgb(24, 29, 34);
    }
    .logo-and-name{
        display: flex;
        align-items: center;
        text-decoration: none;
        color: black;
        transition: transform 0.25s ease;
    }
    .logo-and-name:hover{
        transform: translateY(-5px);
    }
    .icon{
        width: 50px;
        margin: 10px;
    }
    .username{
        font-family: poxast;
        font-size: 15px;
    }
    .header-icons{display: flex; align-items: center; margin-right: 10px;}
    .header-icons button{
        width: 50px;
        background: none;
        border: none;
        margin: 5px;
        transition: transform 0.25s ease;
    }
    .header-icons button:hover{
        cursor: pointer;
        transform: translateY(-5px);
    }
    .ig{width: 45px !important;}
    .footer-icons{
        display: flex;
        justify-content: center;
        margin: 20px 20px 0px 20px;
    }
    .footer-icons button{
        width: 50px;
        background: none;
        border: none;
        margin-left: 10px;
        margin-right: 10px;
        transition: transform 0.25s ease;
    }
    .footer-icons button:hover{
        transform: translateY(-5px);
        cursor: pointer;
    }
    .footer-content{
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .copyright{font-family: jost;}
    .footer-youtube-logo{width: 50px;}

    .test-card{
        border: 2px solid rgb(24, 29, 34);
        box-shadow: 5px 5px 0px 1px rgb(24, 29, 34);
        border-radius: 10px;
        padding: 50px 30px 50px 30px;
        margin: 35px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: rgb(175,223,225);
    }
    .test-card h1{
        font-family: poxast;
        margin: 0;
        font-size: clamp(10px,3vw,20px);
        text-align: center;
    }
    .test-card button{
        padding: 10px;
        margin: 20px;
        width: 75%;
        background-color: rgb(117,159,164);
        font-family: poxast;
        font-size: clamp(5px,2vw,10px);
        border: 2px solid rgb(24, 29, 34);
        box-shadow: 0px 5px 0px 0px rgb(24, 29, 34);
        border-radius: 5px;
        transition: background-color 0.25s ease;
    }
    .test-card button:hover{
        cursor: pointer;
        background-color:rgb(46, 190, 190);
    }
    @media(max-width: 768px){
        .logo-and-name h1{
            display: none;
        }
        .main-content{
            justify-content: center;
            align-items: flex-start;
        }
        .test-card{
            width: 95%;
        }
    }
</style>
<body>
    <div class = "content-wrapper">
        <header class = "header-content section">
            <a href = "/" class = "logo-and-name">
                <img class = "icon" src = "/icon.png">
                <h1 class = "username">small_j1337</h1>
            </a>
            <div class = "header-icons">
                <button onclick = "location.assign('https://www.jerryliangportfolio.com')"class = "home"><img src = "/logos/home-icon.svg"></button>
                <button onclick = "window.open('https://www.youtube.com/@small_j1337','_blank')" class = "yt"><img src = "/logos/yt logo.svg"></button>
                <button onclick = "window.open('https://www.instagram.com/small_j1337/','_blank')" class = "ig"><img src = "/logos/instagram logo.svg"></button>
            </div>
        </header>
        <main class = "main-content section">
            <div class = "test-card">
                <h1>AP Calc BC<br>Semester 1<br>Midterm 2</h1>
                <button onclick = "location.assign('https://jerryliangportfolio.com/practice-sets/calc-bc-s1-midterm2/')">Practice Set</button>
            </div>
            <div class = "test-card" style = "opacity: 0.4;">
                <h1>AP Calc BC<br>Semester 1<br>Final</h1>
                <button style = "pointer-events: none;">Coming Soon</button>
            </div>
        </main>
        <footer class = "footer-content section">
             <div class = "footer-icons">
                <button onclick = "window.open('https://www.youtube.com/@small_j1337','_blank')"><img class = "footer-youtube-logo" src = "/logos/yt logo.svg"></button>
                <button onclick = "window.open('https://www.instagram.com/small_j1337/','_blank')"><img class = "footer-instagram-logo" src = "/logos/instagram logo.svg"></button>
            </div>
            <p class = "copyright">© Jerry Liang 2025</p>
        </footer>
    </div>
</body>
</html>
