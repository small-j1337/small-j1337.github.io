<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.png">
    <link rel = "stylesheet" href = "/header.css">
    <link rel = "stylesheet" href = "/text-styles.css">
    <link rel = "stylesheet" href = "/footer.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerry's Portfolio - Practice</title>
</head>
<body>
    <style>
        body{
            margin: 0;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .container{
            /*Specify Height Here, not in CSS File*/
            
            background-size: 200vw 112.5vw;
            animation: back-ground 5s forwards;
            background-position: center top;
            background-attachment:fixed;
            overflow: clip;
        }
        .main-content-wrapper{
            width: 100vw;
            min-height: 100vh;
            z-index: 900;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: url("/backgrounds/practice-set-pattern.svg");
            background-size: cover;
            background-position: center center;
        }
        .navbar{
            position: fixed;
            box-shadow: 0px 2px 5px 5px rgba(0,0,0,0.25);
            z-index: 999;
        }
        .links a{
            color: rgb(255, 255, 255) !important;
        }
        .hamburger{
            color: rgb(255, 255, 255) !important;
        }
        .practice-sets-wrapper{
            width: 95vw;
            max-width: 1000px;
            margin-top: clamp(60px,20vw,100px);
            flex: 1;
            border-radius: 5px;
        }
        .copyright{
            color: white;
        }
    </style>
    <div class = "mobile-overlay" id = "mobile-overlay">
        <ul class = "mobile-links">
            <button class = "close" id = "close" onclick = "document.body.classList.remove('noScroll'); document.getElementById('mobile-overlay').classList.remove('show') ">&times</button>
            <li><a href = "/">Home</a></li>
            <li><a href = "/projects/">My Projects</a></li>
            <li><a href = "/community/">Community</a></li>
            
        </ul>
    </div>
    <div class = "container">
        <nav class = "navbar" id = "navbar">
            <button class = "logo-button" onclick = "location.assign('/')"><img class = "logo" src = "/icon.png"></button>
            <div class = "links">
                <li><a class = "menu-option" id = "menu-option" style = "text-decoration: underline; text-underline-offset: 3px;"href = "/">Main Website</a></li>
            </div>
            <button class = "hamburger" id = "hamburger" onclick = "document.body.classList.add('noScroll'); document.getElementById('mobile-overlay').classList.add('show') ">☰</button>
        </nav>
    </div>
    <div class = "main-content-wrapper">
        <div class = "practice-sets-wrapper">

        </div>
        <footer class = "footer">
            <div class = "icons">
                <button onclick = "window.open('https://www.youtube.com/@small_j1337','_blank')"><img class = "youtube-logo" src = "/logos/yt logo white.svg"></button>
                <button onclick = "window.open('https://www.instagram.com/small_j1337/','_blank')"><img class = "instagram-logo" src = "/logos/instagram logo white.svg"></button>
            </div>
            <p class = "copyright">© Jerry Liang 2025</p>
        </footer>
    </div>
</body>
</html>
