<html>
<head>
    <meta charset="UTF-8" />
    <meta name = "theme-color" content = "#686df2"/>
    <link rel="icon" type="image/x-icon" href="/icon.png">
    <link rel = "stylesheet" href = "header.css">
    <link rel = "stylesheet" href = "text-styles.css">
    <link rel = "stylesheet" href = "footer.css">
    <meta property="og:site_name" content="Jerry Liang’s Portfolio" />
    <meta property="og:title" content="Jerry Liang’s Portfolio" />
    <meta property="twitter:title" content="Jerry Liang’s Portfolio" />
    <meta property="og:url" content="https://jerryliangportfolio.com/" />
    <meta property="og:type" content="website">
    <meta property="og:description" content="Welcome to Jerry Liang's portfolio website!"/>
    
    <meta property="og:image:secure_url" content="https://jerryliangportfolio.com/thumbnails/home-thumbnail.jpg"/>
    <meta property="twitter:image" content="https://jerryliangportfolio.com/thumbnails/home-thumbnail.jpg"/>
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:description" content="Welcome to Jerry Liang's portfolio website!">
    <meta property="og:image" content="https://jerryliangportfolio.com/thumbnails/home-thumbnail.jpg"/>







    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Jerry Liang's Portfolio",
    "url": "https://jerryliangportfolio.com/"
    }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jerry's Portfolio - Home</title>
</head>
<body>
    <style>
        ::selection{
            background-color: #a3a6fb;
        }
        @keyframes mid-ground{
            to{
                transform: translateY(0vw);
                opacity: 1;
                scale: 1;
            }
        }
        @keyframes fore-ground{
            to{
                scale: 1;
                opacity: 1;
            }
        }
       
        @keyframes site-title{
            from{opacity: 0;}to{opacity:0.8}
        }
        @keyframes fade-out{
            from{opacity: 1;}to{opacity:0;}
        }
        @keyframes grid-item{
            from{
                transform: translateY(50px);
                opacity: 0;
            }
            to{
                transform: translateY(0);
                opacity: 1;
            }
        }
        @keyframes back-ground{
            to{
                background-size: 100vw 56.25vw;
            }
        }
        body{
            margin: 0;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        html{
            overscroll-behavior: none;
            scrollbar-color: #686df2;
        }
        .container{
            /*Specify Height Here, not in CSS File*/
            height: 56.25vw;
            background-image: url("backgrounds/milky-way-2.jpg");
            background-size: 200vw 112.5vw;
            animation: back-ground 5s forwards;
            background-position: center top;
            background-attachment:fixed;
            overflow: clip;
        }
        .foreground{
            scale: 4;
            opacity: 0;
            position: absolute;
            width: 100vw;
            z-index: 300;
            animation: fore-ground 2s forwards 3s;
            pointer-events: none;
            overscroll-behavior: none;
            overflow: clip;
        }
        .midground{
            transform: translateY(40vw);
            opacity: 0;
            scale: 3;
            position: absolute;
            width: 100vw;
            z-index: 200;
            animation: mid-ground 3s forwards 1s;
            transition: transform 3s ease;
            pointer-events: none;
            overscroll-behavior: none;
            overflow: clip;
        }
        .title{
            position: fixed;
            z-index: 150;
            color: white;
            top: clamp(30px,7vw,150px);
            font-size: 7vw !important;
            animation: site-title 5s forwards;
            text-decoration: underline;
            text-underline-offset: 1.5vw;
            text-decoration-color: rgb(255, 76, 106);
            font-family: poxast;
        }
        .main-content-wrapper{
            width: 100vw;
            z-index: 900;
            background: linear-gradient(180deg,rgb(225, 240, 240),rgb(255,255,255));
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-content{
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .grid-container{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 90vw;
            margin-top: 5vw;
        }
        .grid-item{
            position: relative;
            width: 25%;
            margin: 0.5vw;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: grid-item 1s linear;
            animation-timeline: view();
            animation-range: entry 0% cover 20%;
        }
        .grid-item img{
            width: 100%;
            position: absolute;
        }
        .grid-item p{
            position: absolute;
            color: white;
            font-size: 2vw;
            font-family: jost;
            width: 80%;
            text-align: center;
        }
        #center-picture:hover{
            cursor: url('/cursor-icon.png'), auto !important;
        }
        .damage-overlay{
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(255,0,0,0.5);
            opacity: 0;
            transition: opacity 0.1s ease;
        }
        .damage-overlay.show{
            opacity: 1;
        }
        @media(max-width: 770px){
            .grid-container{
                width: 100vw;
            }
            .grid-item{
                width: 30%;
            }
            .grid-item p{
                font-size: 3.5vw;
            }
        }
    </style>
    <div class = "mobile-overlay" id = "mobile-overlay">
        <ul class = "mobile-links">
            <button class = "close" id = "close" onclick = "document.body.classList.remove('noScroll'); document.getElementById('mobile-overlay').classList.remove('show') ">&times</button>
            <li><a href = "/">Home</a></li>
            <li><a href = "/projects/">My Projects</a></li>
            <li><a href = "/community/">Community</a></li>
            
        </ul>
    </div>
    <div class = "container">
        <nav class = "navbar" id = "navbar">
            <button class = "logo-button" onclick = "location.assign('/')"><img class = "logo" src = "/icon.png"></button>
            <div class = "links">
                <li><a class = "menu-option" id = "menu-option" href = "/">Home</a></li>
                <li><a class = "menu-option" id = "menu-option" href = "/projects/">My Projects</a></li>
                <li><a class = "menu-option" id = "menu-option" href = "/community/">Community</a></li>
            </div>
            <button class = "hamburger" id = "hamburger" onclick = "document.body.classList.add('noScroll'); document.getElementById('mobile-overlay').classList.add('show') ">☰</button>
        </nav>
        <img class = "foreground" id = "foreground" src = "backgrounds/jerry-and-arch.png">
        <img class = "midground" id = "midground" src = "backgrounds/canyon-1.png">
        <h1 class = "title">JERRY LIANG</h1>
    </div>
    <div class = "main-content-wrapper">
        <div class = "main-content">
            <div class = "grid-container">
                <div class = "grid-item"><img src = "/index-grid/image-2.jpg"></div>
                <div class = "grid-item" style = "background-color: rgb(20, 66, 94)"><p>Frontend Website Developer</p></div>
                <div class = "grid-item"><img src = "/index-grid/image-5.png"></div>
                <div class = "grid-item" style = "background-color: rgb(33, 101, 144)"><p>Artist</p></div>
                <div class = "grid-item" id = "center-picture"><audio id="damage-sound" src="/sounds/minecraft-damage.mp3" preload="auto"></audio><img src = "/index-grid/image-1.jpg"><div class = "damage-overlay"></div></div>
                <div class = "grid-item"><img src = "/index-grid/image-3.jpg"></div>
                <div class = "grid-item" style = "background-color: rgb(34, 149, 162)"><p>Leader</p></div>
                <div class = "grid-item"><img src = "/index-grid/image-4.jpg"></div>
                <div class = "grid-item" style = "background-color: rgb(66, 108, 232)"><p>World Builder</p></div>
                
            </div>
        </div>
        <footer class = "footer">
            <div class = "icons">
                <button onclick = "window.open('https://www.youtube.com/@small_j1337','_blank')"><img class = "youtube-logo" src = "/logos/yt logo.svg"></button>
                <button onclick = "window.open('https://www.instagram.com/small_j1337/','_blank')"><img class = "instagram-logo" src = "/logos/instagram logo.svg"></button>
            </div>
            <p class = "copyright">© Jerry Liang 2026</p>
        </footer>
    </div>
    <script>
        const midground = document.getElementById("midground");
        window.addEventListener("scroll",()=> {
            const scrollY = window.scrollY;
            midground.style.top = (scrollY/2) + "px";
        }); 
    </script>
    <script>
        let damageCount = 0;
        const centerImage = document.getElementById("center-picture");
        const damageSound = document.getElementById("damage-sound");
        const damageOverlay = document.querySelector(".damage-overlay");

        function showMessage(){
            alert("You have hit Jerry " + damageCount + " times already. Try being more gentle to him :))");
        }

        centerImage.addEventListener('click',()=>{
            damageSound.currentTime = 0;
            damageSound.play();
            damageOverlay.classList.add('show');
            damageCount = damageCount + 1;
            console.log(damageCount);

             setTimeout(() => {
                damageOverlay.classList.remove('show');
            }, 250);

            if(damageCount%10 ===0){
                showMessage();
            }
        });
    </script>
    <script src = "/navbar.js"></script>
</body>
</html>
