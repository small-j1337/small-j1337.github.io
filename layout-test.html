<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Test</title>
</head>
<style>
    body{
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: clip;
        font-family: sans-serif;
    }
    .parent{
        position: relative;
        width: 100vw;
        height: 100vh;
        background-color: rgb(255, 144, 144);
        overflow: clip;
    }
    .child{
        position: absolute;
        background-color: rgb(167, 167, 255);
        z-index: 999;
        top: 50%;
        left: 50%;
        transform: translate(-50%,-50%);
        transform-origin: center center;
        min-width: 50px;
        min-height: 50px;
        width: 5vw;
        height: 5vw;
        transition: transform 0.5s ease;
    }
    .child:hover{
        transform: translate(-50%,-50%) scale(1.5);
    }
</style>
<body>
    <div class = "parent">
        <div class = "child"></div>
    </div>
</body>
</html>
