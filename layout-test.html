<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>title</title>
</head>
<style>
    body{
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .parent{
        width: 500px;
        height: 500px;
        background-color: rgb(255, 85, 85);
    }
    .child{
        width: 100px;
        height: 100px;
        transition: scale 0.5s ease;
        background-color: rgb(255, 136, 136);
    }
    .child:hover{
        scale: 5;
    }
</style>
<body>
    <div class = "parent">
        <div class = "child"></div>
    </div>
</body>
</html>
