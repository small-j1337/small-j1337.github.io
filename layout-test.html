<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Icon Lab</title>
</head>
<style>
    body{
        width: 100vw;
        height: 100vh;
        background-color: rgb(80, 226, 214);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .icon{
        width: clamp(100px,10vw,200px);
        height: clamp(100px,10vw,200px);
        position: relative;
        overflow: clip;
        display: flex;
    }
    .icon img{
        width: 100%;
        position: absolute;
        display: flex;
        transition: scale 0.25s ease;
    }
    .icon img:hover{
        scale: 1.1;
        cursor: pointer;
    }
    .icon h1{
        position: absolute;
        color: white;
        font-size: 20px;
        width: 100%;
        text-align: center;
        bottom: 0;
        pointer-events: none;
        font-family: sans-serif;
        margin: 0;
        height: 2vw;
        background-color: rgba(0,0,0,0.5);
    }
</style>
<body>
   <div class = "icon">
        <img src = "sample-icon.jpeg">
        <h1>My Icon</h1>
   </div>
</body>
</html>
